<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #dddddd;
}

.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #e9e9e9;
  padding: 0 16px;
}

.topnav h2 {
  margin: 0;
}

.topnav .search-container {
  display: flex;
  align-items: center;
  gap: 6px;
}

.topnav .search-container label {
  font-size: 12px;
  white-space: nowrap;
}

.topnav input[type=text] {
  padding: 6px;
  font-size: 17px;
  border: none;
}

.topnav .search-container button {
  padding: 6px 10px;
  background: #ddd;
  font-size: 17px;
  border: none;
  cursor: pointer;
}

@media screen and (max-width: 600px) {
    .topnav .search-container {
        float: none;
    }
    .topnav input[type=text], .topnav .search-container button {
        float: none;
        display: block;
        text-align: left;
        width: 100%;
        margin: 0;
        padding: 14px;
        box-sizing: border-box;
    }
    .topnav input[type=text] {
        border: 1px solid #ccc;
    }
}
</style>
</head>
<body>

<div class="topnav">
 <h2>HTML Table</h2>
    <div class="search-container">
        <label><b>querySelector</b></label>
        <input type="text" id="searchInput1" placeholder="Search (querySelector)" onkeyup="searchQuerySelector()">
        <button type="button" onclick="searchQuerySelector()"><i class="fa fa-search"></i></button>
    </div>
    <div class="search-container">
        <label><b>querySelectorAll</b></label>
        <input type="text" id="searchInput2" placeholder="Search (querySelectorAll)" onkeyup="searchQuerySelectorAll()">
        <button type="button" onclick="searchQuerySelectorAll()"><i class="fa fa-search"></i></button>
    </div>
    <div class="search-container">
        <label><b>getElementsByTagName</b></label>
        <input type="text" id="searchInput3" placeholder="Search (getByTagName)" onkeyup="searchGetElementsByTagName()">
        <button type="button" onclick="searchGetElementsByTagName()"><i class="fa fa-search"></i></button>
    </div>
</div>

<table id="dataTable">
  <tr>
    <th>Company</th>
    <th>Contact</th>
    <th>Country</th>
  </tr>
  <tr>
    <td>Alfreds Futterkiste</td>
    <td>Maria Anders</td>
    <td>Germany</td>
  </tr>
  <tr>
    <td>Centro comercial Moctezuma</td>
    <td>Francisco Chang</td>
    <td>Mexico</td>
  </tr>
  <tr>
    <td>Ernst Handel</td>
    <td>Roland Mendel</td>
    <td>Austria</td>
  </tr>
  <tr>
    <td>Island Trading</td>
    <td>Helen Bennett</td>
    <td>UK</td>
  </tr>
  <tr>
    <td>Laughing Bacchus Winecellars</td>
    <td>Yoshi Tannamuri</td>
    <td>Canada</td>
  </tr>
  <tr>
    <td>Magazzini Alimentari Riuniti</td>
    <td>Giovanni Rovelli</td>
    <td>Italy</td>
  </tr>
</table>

<script>
function searchQuerySelector() {
  var input = document.querySelector("#searchInput1");
  var filter = input.value.toLowerCase();
  var rows = document.querySelectorAll("#dataTable tr");

  rows.forEach(function(row, index) {
    if (index === 0) return;
    var tds = row.querySelectorAll("td");
    var match = false;

    tds.forEach(function(td) {
      td.innerHTML = td.textContent;
      if (td.textContent.toLowerCase().indexOf(filter) > -1) {
        match = true;
      }
    });

    if (filter === "") {
      row.style.display = "";
      return;
    }

    if (!match) {
      row.style.display = "none";
    } else {
      row.style.display = "";
      var found = false;
      tds.forEach(function(td) {
        if (!found) {
          var originalText = td.textContent;
          var lowerText = originalText.toLowerCase();
          var idx = lowerText.indexOf(filter);
          if (idx > -1) {
            td.innerHTML = originalText.substring(0, idx) +
              "<mark style='background:lightgreen'>" + originalText.substring(idx, idx + filter.length) + "</mark>" +
              originalText.substring(idx + filter.length);
            found = true;
          }
        }
      });
    }
  });
}

function searchQuerySelectorAll() {
  var input = document.querySelector("#searchInput2");
  var filter = input.value.toLowerCase();
  var rows = document.querySelectorAll("#dataTable tr");

  rows.forEach(function(row, index) {
    if (index === 0) return;
    var tds = row.querySelectorAll("td");
    var match = false;

    tds.forEach(function(td) {
      td.innerHTML = td.textContent;
      if (td.textContent.toLowerCase().indexOf(filter) > -1) {
        match = true;
      }
    });

    if (filter === "") {
      row.style.display = "";
      return;
    }

    if (!match) {
      row.style.display = "none";
    } else {
      row.style.display = "";
      tds.forEach(function(td) {
        var originalText = td.textContent;
        var lowerText = originalText.toLowerCase();
        var idx = lowerText.indexOf(filter);
        if (idx > -1) {
          td.innerHTML = originalText.substring(0, idx) +
            "<mark style='background:yellow'>" + originalText.substring(idx, idx + filter.length) + "</mark>" +
            originalText.substring(idx + filter.length);
        }
      });
    }
  });
}

function searchGetElementsByTagName() {
  var input = document.getElementById("searchInput3");
  var filter = input.value.toLowerCase();
  var table = document.getElementById("dataTable");
  var rows = table.getElementsByTagName("tr");

  for (var i = 1; i < rows.length; i++) {
    var tds = rows[i].getElementsByTagName("td");
    var match = false;

    for (var j = 0; j < tds.length; j++) {
      tds[j].innerHTML = tds[j].textContent;
      if (tds[j].textContent.toLowerCase().indexOf(filter) > -1) {
        match = true;
      }
    }

    if (filter === "") {
      rows[i].style.display = "";
      continue;
    }

    if (!match) {
      rows[i].style.display = "none";
    } else {
      rows[i].style.display = "";
      for (var j = 0; j < tds.length; j++) {
        var originalText = tds[j].textContent;
        var lowerText = originalText.toLowerCase();
        var idx = lowerText.indexOf(filter);
        if (idx > -1) {
          tds[j].innerHTML = originalText.substring(0, idx) +
            "<mark style='background:lightblue'>" + originalText.substring(idx, idx + filter.length) + "</mark>" +
            originalText.substring(idx + filter.length);
        }
      }
    }
  }
}
</script>

</body>
</html>
